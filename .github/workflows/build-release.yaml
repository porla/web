name: Build and release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

jobs:
  version:
    name: GitVersion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gittools/actions/gitversion/setup@v4.1.0
        with:
          versionSpec: '6.3.x'

      - id: gitversion
        uses: gittools/actions/gitversion/command@v4.1.0
        with:
          arguments: -output file -outputfile version.json

      - uses: actions/upload-artifact@v4
        with:
          name: version.json
          path: version.json

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - run: bun i
      - run: bun run build

      - uses: actions/download-artifact@v4
        with:
          name: version.json
          path: dist/

      - run: pushd dist && zip -9 -r ../webui.zip * && popd && ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: webui.zip
          path: webui.zip

  release:
    if: success() && github.repository == 'porla/web' && github.ref_type == 'tag'
    name: Create release
    runs-on: ubuntu-latest
    needs: [build]

    permissions:
      contents: write
      packages: write
      pull-requests: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: webui.zip

      - run: gh release create $GITHUB_REF_NAME -d -t "$GITHUB_REF_NAME"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: gh release upload $GITHUB_REF_NAME webui.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
